<section class="card" aria-label="All Transactions">
	<div class="transactions__toolbar">
		<div class="search-field">
			<svg
				class="search-field__icon"
				width="14"
				height="14"
				viewBox="0 0 14 14"
				fill="none"
				xmlns="http://www.w3.org/2000/svg"
			>
				<path
					d="M12.2501 12.2501L9.71843 9.71843M11.0833 6.41667C11.0833 8.994 8.994 11.0833 6.41667 11.0833C3.83934 11.0833 1.75 8.994 1.75 6.41667C1.75 3.83934 3.83934 1.75 6.41667 1.75C8.994 1.75 11.0833 3.83934 11.0833 6.41667Z"
					stroke="currentColor"
					stroke-linecap="round"
				/>
			</svg>
			<input
				class="form-field search-field__input"
				type="search"
				id="search"
				placeholder="Search Transactios"
				autocomplete="off"
				data-search-input
			/>
		</div>
		<file-import-export></file-import-export>
	</div>

	<div class="table-wrap">
		<table class="table">
			<thead>
				<tr>
					<th>
						<button type="button" class="table__sort" data-sort="id" data-type="text">
							ID
							<svg
								width="12"
								height="12"
								viewBox="0 0 12 12"
								fill="none"
								xmlns="http://www.w3.org/2000/svg"
							>
								<path
									d="M6.0004 2.49957V9.50037M2.5 5.99997L6.0004 9.50037L9.5008 5.99997"
									stroke="currentColor"
									stroke-linecap="round"
								/>
							</svg>
						</button>
					</th>

					<th>
						<button type="button" class="table__sort" data-sort="description" data-type="text">
							Description
							<svg
								width="12"
								height="12"
								viewBox="0 0 12 12"
								fill="none"
								xmlns="http://www.w3.org/2000/svg"
							>
								<path
									d="M6.0004 2.49957V9.50037M2.5 5.99997L6.0004 9.50037L9.5008 5.99997"
									stroke="currentColor"
									stroke-linecap="round"
								/>
							</svg>
						</button>
					</th>

					<th>
						<button type="button" class="table__sort" data-sort="category" data-type="text">
							Category
							<svg
								width="12"
								height="12"
								viewBox="0 0 12 12"
								fill="none"
								xmlns="http://www.w3.org/2000/svg"
							>
								<path
									d="M6.0004 2.49957V9.50037M2.5 5.99997L6.0004 9.50037L9.5008 5.99997"
									stroke="currentColor"
									stroke-linecap="round"
								/>
							</svg>
						</button>
					</th>

					<th>
						<button type="button" class="table__sort" data-sort="amount" data-type="number">
							Amount
							<svg
								width="12"
								height="12"
								viewBox="0 0 12 12"
								fill="none"
								xmlns="http://www.w3.org/2000/svg"
							>
								<path
									d="M6.0004 2.49957V9.50037M2.5 5.99997L6.0004 9.50037L9.5008 5.99997"
									stroke="currentColor"
									stroke-linecap="round"
								/>
							</svg>
						</button>
					</th>

					<th>
						<button type="button" class="table__sort" data-sort="date" data-type="date">
							Date
							<svg
								width="12"
								height="12"
								viewBox="0 0 12 12"
								fill="none"
								xmlns="http://www.w3.org/2000/svg"
							>
								<path
									d="M6.0004 2.49957V9.50037M2.5 5.99997L6.0004 9.50037L9.5008 5.99997"
									stroke="currentColor"
									stroke-linecap="round"
								/>
							</svg>
						</button>
					</th>
				</tr>
			</thead>

			<tbody data-table-body></tbody>
		</table>
	</div>
</section>
